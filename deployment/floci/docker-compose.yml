services:
  floci:
    image: floci/floci:latest
    container_name: floci
    user: root
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_SERVICES_UI_BIND_ADDRESS: "127.0.0.1"
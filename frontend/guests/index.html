
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Planner - Guest Management</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Wedding Planner</h1>
        <p>Guest Management</p>
    </header>

    <main>

        <section id="dashboard">
            <h2>Guest Overview</h2>

            <div class="stats">
                <div class="stat-card">
                    <h3>Total Guests</h3>
                    <p id="total-guests">0</p>
                </div>

                <div class="stat-card">
                    <h3>Confirmed</h3>
                    <p id="confirmed-guests">0</p>
                </div>

                <div class="stat-card">
                    <h3>Declined</h3>
                    <p id="declined-guests">0</p>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pending-guests">0</p>
                </div>
            </div>
        </section>

        <section id="add-guest">
            <h2>Add New Guest</h2>

            <form id="guest-form">
                <label for="weddingId">Wedding ID</label>
                <input type="text" id="weddingId" required>

                <label for="name">Guest Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" required>

                <button type="submit">Add Guest</button>
            </form>

            <p id="form-message" aria-live="polite"></p>
        </section>

        <section id="guest-list">
            <h2>Guest List</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Search by name or email..."
            >

            <div id="guests-container"></div>
        </section>

    </main>

</body>
</html>
